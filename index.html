<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA VIP PRO MAX - Bio Profile Card</title>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://images.alphacoders.com/132/1328904.png') no-repeat center center/cover;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* Canvas nền hiệu ứng tuyết/hạt lấp lánh */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Lớp phủ chuyển màu Cyber-Pink */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(255, 105, 180, 0.25) 0%, rgba(10, 10, 20, 0.6) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Controls góc trên trái */
        .top-left-controls {
            position: absolute;
            top: 25px;
            left: 25px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .icon-btn {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .icon-btn:hover {
            background: rgba(255, 182, 193, 0.4);
            transform: translateY(-4px) scale(1.1);
            border-color: #ffb6c1;
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.8);
        }

        /* Container Chính */
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            z-index: 5;
            width: 90%;
            max-width: 480px;
            transform-style: preserve-3d;
        }

        /* Thẻ Glassmorphism VIP Pro Max */
        .glass-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.3);
            padding: 22px 25px;
            color: #fff;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
        }

        /* Viền sáng Holographic chạy quanh card */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transform: rotate(45deg);
            animation: borderShimmer 4s infinite linear;
            pointer-events: none;
        }

        @keyframes borderShimmer {
            0% { transform: translateY(-100%) rotate(45deg); }
            100% { transform: translateY(100%) rotate(45deg); }
        }

        .glass-card:hover {
            box-shadow: 0 20px 45px rgba(255, 105, 180, 0.4), 0 0 25px rgba(255, 255, 255, 0.5);
        }

        /* Profile Card */
        .profile-card {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .avatar-wrapper {
            position: relative;
            width: 105px;
            height: 105px;
            flex-shrink: 0;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 20px rgba(255, 192, 203, 0.6);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.1) rotate(8deg);
        }

        /* Vòng halo & Vương miện VIP */
        .avatar-wrapper::before {
            content: '👑';
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
            filter: drop-shadow(0 0 8px gold);
            animation: crownFloat 2s ease-in-out infinite alternate;
            z-index: 3;
        }

        @keyframes crownFloat {
            0% { transform: translateX(-50%) translateY(0) rotate(-5deg); }
            100% { transform: translateX(-50%) translateY(-6px) rotate(5deg); }
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .name-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-info h2 {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }

        /* Badge VIP SSSSSSS */
        .vip-badge {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #000;
            font-size: 9px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            letter-spacing: 1px;
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px #FFD700; }
            100% { box-shadow: 0 0 15px #FF4500, 0 0 25px #FFD700; }
        }

        .profile-info .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 4px;
            font-style: italic;
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            gap: 14px;
        }

        .social-icons a {
            color: #fff;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0.9;
            display: inline-block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .social-icons a:hover {
            transform: translateY(-6px) scale(1.3);
            opacity: 1;
            color: #ffb6c1;
            filter: drop-shadow(0 0 8px #ffb6c1);
        }

        .stats {
            position: absolute;
            bottom: -8px;
            left: 18px;
            display: flex;
            gap: 10px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            background: rgba(0, 0, 0, 0.35);
            padding: 3px 10px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Music Player Card */
        .music-card {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 14px 22px;
        }

        .music-thumb-container {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }

        .music-thumb {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.9);
            animation: spin 6s linear infinite;
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.5);
        }

        .music-thumb.paused {
            animation-play-state: paused;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .music-info {
            flex-grow: 1;
        }

        .music-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .music-progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 6px;
        }

        .progress-bar {
            flex-grow: 1;
            height: 6px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffb6c1, #ff69b4);
            border-radius: 3px;
            box-shadow: 0 0 8px #ff69b4;
            transition: width 0.1s linear;
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #fff;
            font-size: 16px;
        }

        .music-controls i {
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .music-controls i:hover {
            transform: scale(1.3);
            color: #ffb6c1;
        }

        /* Watermark */
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.8);
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Canvas hạt chuyển động -->
    <canvas id="particleCanvas"></canvas>

    <!-- Controls Góc trái -->
    <div class="top-left-controls">
        <div class="icon-btn" id="volumeBtn"><i class="fa-solid fa-volume-high"></i></div>
        <div class="icon-btn" id="heartBtn"><i class="fa-solid fa-heart" style="color: #ff4757;"></i></div>
    </div>

    <!-- Khung chính -->
    <div class="container" id="cardContainer">
        
        <!-- Thẻ Bio -->
        <div class="glass-card profile-card">
            <div class="avatar-wrapper">
                <img src="https://i.pinimg.com/564x/89/3b/b1/893bb182285bf8a29a676b737119ecb0.jpg" alt="Avatar" class="avatar">
                <div class="stats">
                    <span><i class="fa-solid fa-heart" style="color: #ff4757;"></i> <span id="likeCount">999</span></span>
                    <span><i class="fa-solid fa-eye"></i> 3.1K</span>
                </div>
            </div>

            <div class="profile-info">
                <div class="name-container">
                    <h2>Sanz hang</h2>
                    <span class="vip-badge">SSSS+</span>
                </div>
                <div class="subtitle">with luvvv... ✨</div>
                
                <div class="social-icons">
                    <a href="#" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                    <a href="#" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" title="Discord"><i class="fa-brands fa-discord"></i></a>
                </div>
            </div>
        </div>

        <!-- Thẻ Music Player -->
        <div class="glass-card music-card">
            <div class="music-thumb-container">
                <img src="https://i.pinimg.com/564x/89/3b/b1/893bb182285bf8a29a676b737119ecb0.jpg" alt="Song Cover" class="music-thumb" id="albumArt">
            </div>
            
            <div class="music-info">
                <div class="music-title">/uwu - Lofi Chill Beats</div>
                <div class="music-progress-container">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBarContainer">
                        <div class="progress" id="progressBar"></div>
                    </div>
                    <span id="durationTime">0:00</span>
                </div>
            </div>

            <div class="music-controls">
                <i class="fa-solid fa-backward-step" id="prevBtn"></i>
                <i class="fa-solid fa-play" id="playBtn"></i>
                <i class="fa-solid fa-forward-step" id="nextBtn"></i>
            </div>
        </div>

    </div>

    <div class="watermark">NYANYAN.VIP</div>

    <!-- Trình phát audio thật (Lofi Chill Beat) -->
    <audio id="audioPlayer" src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" loop></audio>

    <script>
        // --- 1. XỬ LÝ ÂM THANH & PHÁT NHẠC THẬT ---
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const albumArt = document.getElementById('albumArt');
        const progressBar = document.getElementById('progressBar');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const volumeBtn = document.getElementById('volumeBtn');
        const heartBtn = document.getElementById('heartBtn');
        const likeCount = document.getElementById('likeCount');

        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                albumArt.classList.add('paused');
                playBtn.className = 'fa-solid fa-play';
            } else {
                audio.play();
                albumArt.classList.remove('paused');
                playBtn.className = 'fa-solid fa-pause';
            }
            isPlaying = !isPlaying;
        }

        playBtn.addEventListener('click', togglePlay);

        // Cập nhật thanh tiến trình nhạc
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${progressPercent}%`;

                // Định dạng phút:giây
                const curMins = Math.floor(audio.currentTime / 60);
                const curSecs = Math.floor(audio.currentTime % 60);
                const durMins = Math.floor(audio.duration / 60);
                const durSecs = Math.floor(audio.duration % 60);

                currentTimeEl.textContent = `${curMins}:${curSecs < 10 ? '0' : ''}${curSecs}`;
                durationTimeEl.textContent = `${durMins}:${durSecs < 10 ? '0' : ''}${durSecs}`;
            }
        });

        // Tua nhạc khi bấm vào thanh thời gian
        progressBarContainer.addEventListener('click', (e) => {
            const width = progressBarContainer.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        // Tắt/Mở tiếng
        volumeBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            volumeBtn.innerHTML = audio.muted ? 
                '<i class="fa-solid fa-volume-xmark" style="color:#ff4757;"></i>' : 
                '<i class="fa-solid fa-volume-high"></i>';
        });

        // Bấm Tym tăng like
        heartBtn.addEventListener('click', () => {
            likeCount.textContent = parseInt(likeCount.textContent) + 1;
            heartBtn.style.transform = 'scale(1.4)';
            setTimeout(() => heartBtn.style.transform = 'scale(1)', 200);
        });

        // --- 2. HIỆU ỨNG TILT 3D KHI RÊ CHUỘT ---
        const cards = document.querySelectorAll('.glass-card');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                card.style.transform = `rotateX(${-y / 12}deg) rotateY(${x / 12}deg) translateZ(10px)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg) translateZ(0px)';
            });
        });

        // --- 3. CANVAS HẠT ÁNH SÁNG & HOA ANH ĐÀO RƠI ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1,
                speedY: Math.random() * 1 + 0.5,
                speedX: Math.random() * 0.5 - 0.25,
                opacity: Math.random() * 0.7 + 0.3
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;

                if (p.y > canvas.height) p.y = 0;
                if (p.x > canvas.width || p.x < 0) p.x = Math.random() * canvas.width;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 182, 193, ${p.opacity})`;
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- 4. CON TRỎ CHUỘT PHÁT SÁNG (MAGIC TRAIL) ---
        window.addEventListener('mousemove', (e) => {
            if (Math.random() < 0.3) {
                const spark = document.createElement('div');
                spark.style.position = 'fixed';
                spark.style.left = e.clientX + 'px';
                spark.style.top = e.clientY + 'px';
                spark.style.width = '6px';
                spark.style.height = '6px';
                spark.style.backgroundColor = '#ffb6c1';
                spark.style.borderRadius = '50%';
                spark.style.pointerEvents = 'none';
                spark.style.boxShadow = '0 0 10px #ff69b4';
                spark.style.transition = 'all 0.8s ease-out';
                spark.style.zIndex = '9999';

                document.body.appendChild(spark);

                setTimeout(() => {
                    spark.style.transform = `translate(${(Math.random() - 0.5) * 30}px, ${Math.random() * 30}px) scale(0)`;
                    spark.style.opacity = '0';
                }, 10);

                setTimeout(() => spark.remove(), 800);
            }
        });
    </script>
</body>
</html>
